<style>
  :root {
    --bg: #ffffff; --bg2: #f6f7f9; --card: #ffffff;
    --border: #e4e7eb; --border2: #d2d7dd;
    --text: #1b2128; --text2: #62707f; --text3: #8b97a4;
    --accent: #0f6cbd; --accent-text: #ffffff; --accent-soft: #ebf3fb;
    --danger: #c43e3e; --danger-soft: #fbeeee;
    --ok: #107c41; --warn: #9a6700; --warn-soft: #fff3d6;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 10px;
  }
  :root[data-theme="dark"] {
    --bg: #1e2228; --bg2: #171b20; --card: #242a31;
    --border: #333b44; --border2: #414b56;
    --text: #e8ecf1; --text2: #9aa7b4; --text3: #6f7c89;
    --accent: #4d9fe8; --accent-text: #0c1722; --accent-soft: #20313f;
    --danger: #e06c6c; --danger-soft: #3a2426;
    --ok: #4ec27f; --warn: #d9a521; --warn-soft: #38301a;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 13.5px/1.45 "Segoe UI", -apple-system, "SF Pro Text", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  .tb-title { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; min-width: 0; }
  .tb-title .muted { font-weight: 400; }
  .tb-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .muted { color: var(--text2); font-size: 12.5px; }
  .faint { color: var(--text3); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border2); background: var(--card);
    border-radius: 7px; padding: 5px 10px; cursor: pointer;
    font-size: 12.5px; transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--bg2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--text2); }
  .btn.ghost:hover { background: var(--bg2); color: var(--text); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn svg { flex-shrink: 0; }
  .iconbtn { padding: 5px; border-radius: 7px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12.5px; font-weight: 600; letter-spacing: .3px;
    user-select: none;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 99px; padding: 2px 9px; font-size: 11.5px; color: var(--text2);
  }
  .chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .chip.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
  .empty {
    padding: 36px 16px; text-align: center; color: var(--text3); font-size: 13px;
  }
  .empty .big { font-size: 26px; margin-bottom: 8px; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--border2); border-top-color: var(--accent);
    animation: spin .7s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .statusbar {
    padding: 6px 14px; border-top: 1px solid var(--border);
    color: var(--text3); font-size: 11.5px; display: flex; justify-content: space-between; gap: 8px;
  }
  .banner {
    margin: 10px 14px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px;
    background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger);
  }
  .scroll { overflow-y: auto; max-height: 460px; }
  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 6px; }
  .fade-in { animation: fadein .18s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  input[type="text"], input[type="date"], input[type="search"] {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border2); border-radius: 7px; padding: 6px 10px;
    outline: none; transition: border-color .12s, box-shadow .12s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
</style>
<script>
"use strict";
/* Minimal MCP Apps bridge — implements the 2026-01-26 postMessage dialect:
   ui/initialize handshake, tool-input/tool-result notifications, tools/call,
   host-context-changed, size-changed. No external dependencies. */
const MCPApp = (() => {
  const PROTOCOL = "2026-01-26";
  let nextId = 1;
  const pending = new Map();
  const handlers = { toolResult: [], toolInput: [], hostContext: [] };
  let hostContext = null;
  let embedded = true;

  function post(msg) { try { window.parent.postMessage(msg, "*"); } catch (e) {} }
  function notify(method, params) { post({ jsonrpc: "2.0", method, params: params || {} }); }
  function request(method, params) {
    return new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, { resolve, reject });
      post({ jsonrpc: "2.0", id, method, params: params || {} });
    });
  }

  function applyTheme(theme) {
    const dark = theme === "dark" ||
      (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  }

  function emit(kind, payload) { for (const fn of handlers[kind]) { try { fn(payload); } catch (e) { console.error(e); } } }

  window.addEventListener("message", (ev) => {
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && m.method === undefined) {       // response to one of our requests
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.error) p.reject(new Error(m.error.message || "host error"));
      else p.resolve(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-result") emit("toolResult", m.params || {});
    else if (m.method === "ui/notifications/tool-input") emit("toolInput", m.params || {});
    else if (m.method === "ui/notifications/host-context-changed") {
      hostContext = Object.assign(hostContext || {}, m.params || {});
      if (m.params && m.params.theme) applyTheme(m.params.theme);
      emit("hostContext", hostContext);
    } else if (m.id !== undefined) {                          // unknown request from host
      post({ jsonrpc: "2.0", id: m.id, error: { code: -32601, message: "method not found" } });
    }
  });

  function watchSize() {
    let raf = 0;
    const send = () => {
      raf = 0;
      notify("ui/notifications/size-changed", {
        width: document.documentElement.scrollWidth,
        height: Math.min(document.documentElement.scrollHeight, 1200),
      });
    };
    const queue = () => { if (!raf) raf = requestAnimationFrame(send); };
    new ResizeObserver(queue).observe(document.body);
    queue();
  }

  async function init(appInfo) {
    applyTheme(null);
    embedded = window.parent !== window;
    if (!embedded) return null;   // opened directly in a browser — render-only mode
    const result = await request("ui/initialize", {
      protocolVersion: PROTOCOL,
      appInfo: appInfo || { name: "outlook-mcp-app", version: "1.0.0" },
      appCapabilities: { availableDisplayModes: ["inline"] },
    });
    hostContext = (result && result.hostContext) || {};
    if (hostContext.theme) applyTheme(hostContext.theme);
    notify("ui/notifications/initialized", {});
    watchSize();
    return result;
  }

  async function callTool(name, args) {
    const result = await request("tools/call", { name, arguments: args || {} });
    if (result && result.isError) {
      const txt = (result.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
      throw new Error(txt || ("tool " + name + " failed"));
    }
    return result;
  }

  function updateModelContext(text) {
    if (!embedded) return;
    request("ui/update-model-context", {
      content: [{ type: "text", text }],
    }).catch(() => {});
  }

  /* structuredContent if present, else try parsing the text content as JSON */
  function data(result) {
    if (!result) return null;
    if (result.structuredContent) return result.structuredContent;
    const txt = (result.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
    try { return JSON.parse(txt); } catch (e) { return null; }
  }

  return {
    init, callTool, updateModelContext, data,
    onToolResult: fn => handlers.toolResult.push(fn),
    onToolInput: fn => handlers.toolInput.push(fn),
    onHostContext: fn => handlers.hostContext.push(fn),
    get hostContext() { return hostContext; },
  };
})();

/* ---------- shared rendering helpers ---------- */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function initials(name) {
  const parts = String(name || "?").trim().split(/[\s,.;@]+/).filter(Boolean);
  if (!parts.length) return "?";
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
}
function nameHue(name) {
  let h = 0;
  for (const ch of String(name || "")) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}
function avatarHtml(name, size) {
  const s = size || 32;
  return '<span class="avatar" style="width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(s * .38) +
    'px;background:hsl(' + nameHue(name) + ' 45% 45%)">' + esc(initials(name)) + "</span>";
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function fmtClock(d) {
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + String(m).padStart(2, "0") + " " + ap;
}
/* compact timestamp: clock if today, "Jun 12" this year, else "Jun 12, 2025" */
function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const now = new Date();
  if (sameDay(d, now)) return fmtClock(d);
  const md = MONTHS[d.getMonth()] + " " + d.getDate();
  return d.getFullYear() === now.getFullYear() ? md : md + ", " + d.getFullYear();
}
/* day heading: Today / Tomorrow / "Friday, Jun 13" */
function fmtDayHeading(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const now = new Date();
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  if (sameDay(d, now)) return "Today";
  if (sameDay(d, tomorrow)) return "Tomorrow";
  return DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
}
function linkify(text) {
  return esc(text).replace(/\bhttps?:\/\/[^\s<>"']+/g,
    m => '<a href="#" data-url="' + m + '" style="color:var(--accent)">' + m + "</a>");
}
const ICONS = {
  refresh: '<path d="M13.2 8a5.2 5.2 0 1 1-1.5-3.7"/><path d="M13.4 1.8v3h-3"/>',
  trash: '<path d="M2.8 4.3h10.4M6.2 4.3V2.8h3.6v1.5M4.3 4.3l.6 9h6.2l.6-9M6.6 6.8v4M9.4 6.8v4"/>',
  flag: '<path d="M4 14.2V1.8M4 2.5h7.4L9.6 5.4l1.8 2.9H4"/>',
  mailOpen: '<path d="M1.8 6.4 8 2.2l6.2 4.2v7.2H1.8z"/><path d="m1.8 6.4 6.2 4.2 6.2-4.2"/>',
  mail: '<rect x="1.8" y="3.2" width="12.4" height="9.6" rx="1.2"/><path d="m2.2 4 5.8 4.4L13.8 4"/>',
  back: '<path d="M10 2.8 4.8 8 10 13.2"/>',
  check: '<path d="m3 8.6 3.2 3.2L13 4.6"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  search: '<circle cx="7" cy="7" r="4.6"/><path d="m10.5 10.5 3.2 3.2"/>',
  pin: '<path d="M8 14.2s4.6-4.5 4.6-7.7a4.6 4.6 0 1 0-9.2 0c0 3.2 4.6 7.7 4.6 7.7z"/><circle cx="8" cy="6.4" r="1.6"/>',
  recur: '<path d="M3 6.5a5 5 0 0 1 9.4-1.3M13 9.5a5 5 0 0 1-9.4 1.3"/><path d="M12.6 2.2v3h-3M3.4 13.8v-3h3"/>',
  clip: '<path d="m12.4 7.2-4.6 4.6a3 3 0 0 1-4.2-4.2L8.8 2.4a2 2 0 0 1 2.8 2.8L7 9.8a1 1 0 0 1-1.4-1.4l4.2-4.2"/>',
  copy: '<rect x="5.5" y="5.5" width="8" height="8" rx="1.2"/><path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/>',
  person: '<circle cx="8" cy="5.2" r="2.8"/><path d="M2.8 13.8a5.2 5.2 0 0 1 10.4 0"/>',
};
function icon(name, size) {
  return '<svg width="' + (size || 15) + '" height="' + (size || 15) + '" viewBox="0 0 16 16" fill="none" ' +
    'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
    ICONS[name] + "</svg>";
}
function showStatus(el, text) { if (el) el.textContent = text; }
function nowClock() { return fmtClock(new Date()); }
</script>
