window.addEventListener("message", ev => {
  const m = ev.data;
  if (!m || m.jsonrpc !== "2.0") return;
  const iframe = document.getElementById("f").contentWindow;
  if (m.method === "ui/initialize") {
    // Validate like a strict host (Claude Desktop): these params are
    // REQUIRED by the MCP Apps spec — a malformed request gets an error,
    // not a silent pass, so protocol drift shows up in local preview.
    const p = m.params || {};
    if (!p.appInfo || !p.appInfo.name || !p.appCapabilities || !p.protocolVersion) {
      console.error("ui/initialize params invalid (appInfo/appCapabilities/protocolVersion required):", p);
      iframe.postMessage({jsonrpc:"2.0", id:m.id, error:{code:-32602,
        message:"Invalid ui/initialize params: appInfo, appCapabilities and protocolVersion are required"}}, "*");
      return;
    }
    iframe.postMessage({jsonrpc:"2.0", id:m.id, result:{
      protocolVersion:"2026-01-26",
      hostCapabilities:{serverTools:{}},
      hostInfo:{name:"harness",version:"0"},
      hostContext:{theme: theme, displayMode:"inline"}
    }}, "*");
  } else if (m.method === "ui/notifications/initialized") {
    iframe.postMessage({jsonrpc:"2.0", method:"ui/notifications/tool-input", params:{arguments:{}}}, "*");
    iframe.postMessage({jsonrpc:"2.0", method:"ui/notifications/tool-result", params: FAKE[view]}, "*");
  } else if (m.method === "tools/call" && m.id !== undefined) {
    if (m.params.name === "outlook_get_mail")
      iframe.postMessage({jsonrpc:"2.0", id:m.id, result: FAKE["mail-view"]}, "*");
    else if (m.params.name === "outlook_get_event")
      iframe.postMessage({jsonrpc:"2.0", id:m.id, result: {content:[],structuredContent:{attendees:[{name:"Sara Khan",response:3},{name:"Ali Raza",response:2}],body:"Agenda: review final numbers."}}}, "*");
    else
      iframe.postMessage({jsonrpc:"2.0", id:m.id, result: FAKE[view] || {content:[]}}, "*");
  }
});
